[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-agents"
version = "0.1.0"
description = "SMART orchestrator with SemantIQ (Power BI semantic models) and N.O.V.A. (visuals) MCP agents"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "langgraph>=0.2.60",
  "mcp>=1.9,<2",
  "msal>=1.31",
  "openai>=1.55",
  "pydantic>=2.8",
  "pydantic-settings>=2.5",
  "pyjwt>=2.9",
  "tenacity>=9.0",
  "pythonnet>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]
metadata = ["psycopg[binary]>=3.2"]
# Free local embeddings for the keyword index (ONNX, no PyTorch). bge-small-en-v1.5 / all-MiniLM-L6-v2.
keyword = ["fastembed>=0.4", "psycopg[binary]>=3.2"]

[project.scripts]
smart-orchestrator = "smart_orchestrator.app:main"
pbi-semantiq = "pbi_semantiq_agent.server:main"
pbi-build-metadata = "pbi_semantiq_agent.build_semantic_metadata:main"
pbi-sync-metadata = "pbi_semantiq_agent.sync_runner:main"
pbi-bridge = "pbi_semantiq_agent.pbi_bridge:main"
pbi-index-keywords = "pbi_semantiq_agent.keyword_index:main"
pbi-nova = "pbi_nova_visual_generator.server:main"

[tool.setuptools]
packages = [
  "smart_common",
  "smart_orchestrator",
  "pbi_semantiq_agent",
  "pbi_nova_visual_generator",
]

[tool.setuptools.package-dir]
smart_common = "shared"
smart_orchestrator = "smart_orchestrator"
pbi_semantiq_agent = "pbi_semantiq_agent"
pbi_nova_visual_generator = "pbi_nova_visual_generator"

[tool.setuptools.package-data]
"*" = ["prompts/*.md", "knowledge/*.json", "adomd/*.dll"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
