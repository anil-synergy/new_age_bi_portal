name: Bi-Report Master CI

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: bireport-web-staging-runner
    
#We are using IAM user "git action" Access and Secret keys    
    steps:
      - uses: actions/checkout@v2
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PROD_STG }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD_STG }}
          aws-region: "ap-south-1"
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v1
        with:
          node-version: '14.18.1'
      - run: yarn install
      - run: CI= yarn run build:prod
      
      - name: Remove previous build files from S3
        run: aws s3 rm --recursive s3://bi-report-web-prod
      - name: Deploy app build to S3 bucket
        run: aws s3 sync ./build s3://bi-report-web-prod     

      # Invalidate Cloudfront (this action)
      - name: invalidate
        uses: chetan/invalidate-cloudfront-action@master
        env:
          DISTRIBUTION: "E2QOLVVCA9Q8LO"
          PATHS: "/*"
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_PROD_STG }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD_STG }}
